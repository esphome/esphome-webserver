name: Release

on:
  push:
    branches:
      - main
    # main only moves via release PRs from dev, but there is no reason to cut a
    # release for a docs-only merge.
    paths:
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .nvmrc
      - .github/workflows/release.yaml
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    # The paths filter only constrains the push trigger; workflow_dispatch can
    # be run from any ref. Without this, dispatching from a feature branch cuts
    # a real tag and release from unreviewed code.
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
      url: ${{ steps.create_release.outputs.url }}
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create a new tag
        id: create_tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.create_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: |
            release/**/*.h
            release/webserver-v1.*
          generate_release_notes: true
          fail_on_unmatched_files: true

  esphome-pr:
    name: Make PR into ESPHome repo
    runs-on: ubuntu-latest
    environment:
      name: esphome
      # Empty when the action finds no asset changes and skips the PR; the
      # deployment then just renders without a link.
      url: ${{ steps.pr.outputs.pull-request-url }}
    # No GITHUB_TOKEN scopes needed: everything that touches esphome/esphome
    # uses the App token minted below, and same-run artifact downloads
    # authenticate with ACTIONS_RUNTIME_TOKEN.
    # Redundant with the guard on release (this job needs it), but this is the
    # job with the outward-facing side effect, so state its precondition here.
    if: github.ref == 'refs/heads/main'
    needs:
      - release
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: esphome
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout esphome repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: esphome/esphome
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Compose the PR body
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
        # Start from esphome's own template so the body always matches what
        # upstream asks for, then fill in the parts we can answer. If upstream
        # rewords one of these lines the body just ends up slightly less filled
        # in, which is not worth failing over once a release has been cut.
        run: |
          set -euo pipefail

          cat >/tmp/description.md <<EOF
          Updates the bundled web server and captive portal assets to [\`${RELEASE_TAG}\`](${RELEASE_URL}).

          Generated automatically by the [esphome-webserver](https://github.com/esphome/esphome-webserver)
          release workflow. These headers are build output - the compressed asset arrays change
          wholesale on every build, so read the release notes rather than the diff.
          EOF

          # A reworded line just no-ops the matching expression, but a renamed
          # or relocated template would make sed exit non-zero under set -e and
          # kill the job after the release is already published. Fall back to
          # the bare description instead.
          if [ ! -f .github/PULL_REQUEST_TEMPLATE.md ]; then
            echo "::warning::esphome PR template not found; using the bare description."
            cp /tmp/description.md /tmp/pr-body.md
          else
            # /anchor/r reads the description in after the placeholder line, and
            # /anchor/d removes the placeholder itself. Written outside the
            # workspace: create-pull-request commits every untracked file.
            sed -e '/<!-- Quick description and explanation of changes -->/r /tmp/description.md' \
                -e '/<!-- Quick description and explanation of changes -->/d' \
                -e 's|^- \[ \] Other$|- [x] Other|' \
                -e 's|^- fixes <link to issue>$|- N/A - automated asset sync.|' \
                -e 's|^- esphome/esphome.io#.*$|- N/A - no user-facing configuration changes.|' \
                -e 's|^- esphome/developers.esphome.io#.*$|- N/A|' \
                -e 's|^  - \[ \] The code change is tested|  - [x] The code change is tested|' \
                .github/PULL_REQUEST_TEMPLATE.md >/tmp/pr-body.md
          fi

          cat /tmp/pr-body.md

      - name: Download component artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/components
          pattern: component-*
          merge-multiple: true

      - name: Move headers into place
        # The artifacts are already laid out as <component>/<file>.
        run: cp -a /tmp/components/. esphome/components/

      - name: PR Changes
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update webserver local assets to ${{ needs.release.outputs.tag }}"
          committer: esphome[bot] <115708604+esphome[bot]@users.noreply.github.com>
          author: esphome[bot] <115708604+esphome[bot]@users.noreply.github.com>
          branch: sync/webserver-assets
          delete-branch: true
          title: "Update webserver local assets to ${{ needs.release.outputs.tag }}"
          body-path: /tmp/pr-body.md
          assignees: jesserockz
